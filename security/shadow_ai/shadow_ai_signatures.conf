# security/shadow_ai/shadow_ai_signatures.conf -- Shadow AI Monitor's
# known-AI-fingerprint reference database.
#
# format: TYPE|PATTERN|CATEGORY|BASE_RISK|LABEL
#   TYPE      - process | port | domain
#               process: substring matched case-insensitively against
#                 a running process's command name AND its (sanitized,
#                 redacted -- see shadow_ai_monitor.sh's own
#                 redact_args()) command-line args.
#               port: exact TCP port number, matched against a LISTEN
#                 or ESTABLISHED socket's LOCAL port (never the remote
#                 port -- see shadow_ai_monitor.sh's own header for why
#                 this module never resolves or trusts a remote port
#                 alone as identifying).
#               domain: substring matched against a process's own
#                 sanitized command-line args ONLY -- this module never
#                 performs DNS/reverse-DNS resolution itself (would be
#                 its own outbound network action, contradicting pure
#                 local observation), so a domain signature can only
#                 ever match text a process itself already exposed
#                 (e.g. a config flag naming an API base URL), never a
#                 live connection's resolved remote name.
#   CATEGORY  - free-form grouping (local_llm_runtime / cloud_ai_api /
#               ai_agent_framework / ai_desktop_app / ai_dev_tool) --
#               documentation + finding-grouping only, no special
#               handling code branches on a specific category name
#               except ai_agent_framework, which
#               scan_agent_links() below uses to weight an
#               agent-to-agent finding higher.
#   BASE_RISK - LOW | MEDIUM | HIGH -- shadow_ai_monitor.sh's own
#               classify_risk() starts here and escalates only for a
#               small, explicit set of reasons (see that function's own
#               header): never a black-box score, same "state the
#               basis, not just the verdict" posture as
#               security/incident_learning/incident_confidence.sh.
#   LABEL     - free-form description (documentation only)
# lines starting with # and blank lines are ignored.
#
# This file is intentionally public/tracked (unlike
# known_ai_allowlist.conf.example's real counterpart) -- it is a
# generic reference of publicly-known AI tool/vendor fingerprints, not
# this deployment's own private data. Curated conservatively: a
# missing signature only means "not yet recognized as AI-related"
# (silently not flagged, same fail-quiet posture as an unmatched CVE in
# incident_normalizer.sh's own extraction), never a false accusation --
# so entries are added deliberately, not guessed broadly.

