# security/dependency_watch/sources.conf -- source_id|host|path
# Every source must ALSO be status=ALLOWED in the HFR Source Registry
# ($HFR_HOME/registry/sources.json) AND be present in
# security/egress_allowlist.conf, or dependency_watch.sh skips it
# without fetching. Canonical hosts only: redirects are never followed.
github-status|www.githubstatus.com|/history.atom
cloudflare-status|www.cloudflarestatus.com|/history.atom
npm-status|status.npmjs.org|/history.atom
# anthropic-status|status.claude.com|/history.atom   (registry: UNKNOWN, owner decision pending)
