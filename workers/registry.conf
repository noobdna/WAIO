# WAIO worker registry
# format: NAME|HOST|SCRIPT|TYPE
#   NAME   - dispatch keyword / worker id (matched case-insensitively against the request text)
#   HOST   - execution target id, see workers/<HOST>.json ("750" = run locally on this machine)
#   SCRIPT - path to the worker script, relative to this repo's root (where waio.sh lives)
#   TYPE   - free-form role tag (documentation only, e.g. research / coder)
# lines starting with # and blank lines are ignored
RESEARCH|750|workers/research_worker.sh|research
