# WAIO -- Takomachi agent registry (single source of truth for agent IDs)
#
# Every Takomachi-backed WAIO worker (research_worker.sh, analysis_worker.sh,
# ai_worker.sh) resolves its own AGENT_ID from this file at request time --
# by CAPABILITY_TAG, not by a hardcoded id -- instead of embedding the
# Takomachi agent id as a literal string. workers/register_takomachi_agents.sh
# (idempotent, GET-before-POST) and dashboard/collect_takomachi_status.sh's
# "expected_agents" check both also read this file, so all three concerns
# (dispatch, provisioning, drift detection) share one definition.
#
# Why this file exists: the original waio-research/waio-analysis/waio-ai
# agents were registered directly in Takomachi's own local takomachi.sqlite
# via a one-time script that was never committed to any repo
# (Takomachi's own `scripts/register-waio-agents.sh`, referenced in this
# file's ARCHITECTURE.md phase but absent from `git log --all` there).
# takomachi.sqlite is itself gitignored, pure local runtime state -- when
# it was later rebuilt (during Takomachi's own unrelated development), the
# registration was lost with no reproducible way to redo it. See
# ARCHITECTURE.md's "Takomachi agent registration" phase entry for the
# full investigation.
#
# format: AGENT_ID|PROVIDER|MODEL|CAPABILITY_TAG|PERSONA_NAME
#   AGENT_ID       - Takomachi agent id (the target_agent_id sent in every
#                     POST /tasks); must match Takomachi's own
#                     schemas/agent.schema.json id pattern (^[a-zA-Z0-9_-]+$).
#   PROVIDER       - Takomachi provider id: gpt / claude / gemini / openrouter.
#   MODEL          - provider-specific model id.
#   CAPABILITY_TAG - Takomachi agent_capability_tags value; also the key
#                     each WAIO worker uses to look up its own AGENT_ID here
#                     (research_worker.sh -> "research", etc.).
#   PERSONA_NAME   - human-readable persona name (Takomachi's persona_name).
# lines starting with # and blank lines are ignored.
waio-research|openrouter|openai/gpt-4o-mini|research|WAIO Research
waio-analysis|openrouter|openai/gpt-4o-mini|analysis|WAIO Analysis
waio-ai|openrouter|openai/gpt-4o-mini|ai|WAIO AI
# waio-orchestrate: provisioned for parity/future use. orchestrate_worker.sh
# does not call Takomachi directly today -- it chains RESEARCH/ANALYSIS/AI
# client-side (see its own header) -- so no worker currently resolves this
# row by capability tag. Registered anyway so it exists if/when a direct
# dispatch path is added, and so dashboard drift-detection covers it too.
waio-orchestrate|openrouter|openai/gpt-4o-mini|orchestrate|WAIO Orchestrate
