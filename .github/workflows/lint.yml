name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check (canonical dispatch path + DLP layer + SSH Guardian layer + Segment Recovery layer + dashboard + taco-control + jobs + earth_weather + Incident Learning Engine + tests)
        run: |
          for f in waio.sh workers/*.sh security/*.sh security/incident_learning/*.sh security/incident_learning/collectors/*.sh dashboard/*.sh taco-control/*.sh jobs/*.sh earth_weather/*.sh tests/*.sh tests/security_fixtures/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: shellcheck (canonical dispatch path + DLP layer + SSH Guardian layer + Segment Recovery layer + tests)
        run: shellcheck -S error waio.sh workers/*.sh security/*.sh tests/*.sh tests/security_fixtures/*.sh

      - name: shellcheck (security/incident_learning/*.sh, Phase 78 -- previously uncovered by any shellcheck glob since security/*.sh above is non-recursive; verified clean this phase across all Step 1-8 files plus the new lock.sh)
        run: shellcheck -S error security/incident_learning/*.sh security/incident_learning/collectors/*.sh

      - name: shellcheck (dashboard scripts, new in this check -- new-file-only for now so a pre-existing style issue in collect_status.sh/build_incident_history.sh can't break CI on an unrelated change)
        run: shellcheck -S error dashboard/collect_segment_status.sh dashboard/refresh_dashboard_cron.sh dashboard/collect_incident_learning_status.sh dashboard/collect_takomachi_status.sh dashboard/collect_snd_status.sh

      - name: shellcheck (taco_control_dispatch.sh only, Red Team finding #2 fix, 2026-09-13 -- same new-file-only rationale as the dashboard step above; taco_control_executor.sh is untouched by this fix and not yet in this check)
        run: shellcheck -S error taco-control/taco_control_dispatch.sh

      - name: shellcheck (jobs/*.sh, Red Team finding #4 fix, 2026-09-13 -- all three files touched by this fix)
        run: shellcheck -S error jobs/*.sh

      - name: shellcheck (earth_weather/*.sh, Earth & Weather Intelligence PoC -- workers/earthweather_worker.sh is already covered by the workers/*.sh step above)
        run: shellcheck -S error earth_weather/*.sh

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: create empty ~/.waio.env (waio.sh sources it; no worker this suite uses reads any var from it)
        run: touch ~/.waio.env

      - name: orchestrate_worker.sh regression suite (Tier 1; Tier 2 skips cleanly, no LAN to 800号機 from CI)
        run: ./tests/orchestrate_worker_test.sh

      - name: waio.sh regression suite (Phase 22, Keychain-free)
        run: ./tests/waio_test.sh

      - name: DLP / Emergency Shutdown Red Team suite (local dummy destinations only; LAN sanity checks skip cleanly)
        run: WAIO_SHUTDOWN_LOCK="$RUNNER_TEMP/security-test-SHUTDOWN.lock" WAIO_AUDIT_LOG="$RUNNER_TEMP/security-test-audit.jsonl" ./tests/security_test.sh

      - name: SSH Guardian config generator suite (fixture-only, never touches /etc/ssh; skips cleanly with no local sshd/LAN)
        run: ./tests/ssh_guardian_config_test.sh

      - name: Segment Recovery MVP suite (Phase 49; fixture-only, loopback health checks, never touches real segments.conf/state; LAN sanity skips cleanly)
        run: ./tests/segment_recovery_test.sh

      - name: Segment monitor cron wrapper suite (Phase 51; fixture-only)
        run: ./tests/segment_monitor_cron_test.sh

      - name: Dashboard refresh cron wrapper suite (Phase 52; read-only collectors, no LAN/SSH)
        run: ./tests/dashboard_refresh_cron_test.sh

      - name: Recovery hardening suite (2026-09-13; fixture-only dummy shutdowns, no LAN/SSH)
        run: ./tests/recovery_hardening_test.sh

      - name: RPi command-injection attack-simulation suite (Red Team finding #1, 2026-09-13; fake ssh on PATH, no real network)
        run: ./tests/rpi_command_injection_test.sh

      - name: Audit log integrity (tamper-evidence) suite (Red Team finding #3, 2026-09-13; fixture-only)
        run: ./tests/audit_log_integrity_test.sh

      - name: taco_control_dispatch.sh command-injection attack-simulation suite (Red Team finding #2, 2026-09-13; fake ssh on PATH, no real network, no host-key trust needed)
        run: ./tests/taco_control_injection_test.sh

      - name: jobs/*.sh + taco_control_dispatch.sh DLP/audit-bypass suite (Red Team finding #4, 2026-09-13; fixture workers/800.json + fake ssh on PATH, no real network)
        run: ./tests/jobs_taco_control_dlp_test.sh

      - name: Earth & Weather Intelligence PoC suite (fixture-only, fake curl on PATH, no real network)
        run: ./tests/earth_weather_test.sh

      - name: Earth & Weather Intelligence -- global multi-station suite (fixture-only, fake curl on PATH, no real network)
        run: ./tests/earth_weather_global_test.sh

      - name: DuCoPA standalone core state-machine suite (fixture-only, no LAN/SSH; structurally isolated from production wiring, see D0/D0b in the suite itself)
        run: ./tests/ducopa_core_test.sh

      - name: DuCoPA Guardian control-plane suite (fixture-only; exercises security/guardian.sh and its wiring into waio.sh/security/lib.sh/security/recover.sh)
        run: ./tests/ducopa_guardian_test.sh

      - name: Dashboard Guardian Control Plane visibility suite (Phase 61; fixture-only, exercises dashboard/collect_status.sh's guardian_control_plane JSON section)
        run: ./tests/collect_status_guardian_test.sh

      - name: Dashboard Guardian Control Plane UI suite (Phase 63; executes dashboard/index.html's own inline script under Node with a minimal DOM stub, no browser/network)
        run: ./tests/dashboard_guardian_ui_test.sh

      - name: Dashboard Incident Learning Engine visibility suite (Phase 76; fixture-only, exercises dashboard/collect_incident_learning_status.sh)
        run: ./tests/collect_incident_learning_status_test.sh

      - name: Dashboard Incident Learning Engine UI suite (Phase 76; executes dashboard/index.html's own inline script under Node with a minimal DOM stub, no browser/network)
        run: ./tests/dashboard_incident_learning_ui_test.sh

      - name: Dashboard Takomachi status collector suite (Phase 76; local mock HTTP server only, no real Keychain/Takomachi -- see that suite's own header)
        run: ./tests/collect_takomachi_status_test.sh

      - name: Takomachi agent registration suite (idempotent GET-before-POST provisioning from workers/takomachi_agents.conf; local mock HTTP server only, no real Keychain/Takomachi)
        run: ./tests/register_takomachi_agents_test.sh

      - name: Dashboard Takomachi UI suite (Phase 76; executes dashboard/index.html's own inline script under Node with a minimal DOM stub, no browser/network)
        run: ./tests/dashboard_takomachi_ui_test.sh

      - name: Dashboard SND status collector suite (Phase 76; local mock HTTP server only, SND_HOME not required)
        run: ./tests/collect_snd_status_test.sh

      - name: Dashboard SND UI suite (Phase 76; executes dashboard/index.html's own inline script under Node with a minimal DOM stub, no browser/network)
        run: ./tests/dashboard_snd_ui_test.sh

      - name: Incident Learning Engine Step 1 suite (knowledge_manager.sh safety backbone; fixture-only, KNOWLEDGE_MANAGER_* overrides, no network)
        run: ./tests/incident_learning_test.sh

      - name: Incident Learning Engine Step 2 suite (mock_collector.sh + incident_normalizer.sh; fixture-only, no network)
        run: ./tests/incident_learning_collector_test.sh

      - name: Incident Learning Engine Step 3 suite (incident_evidence.sh + incident_confidence.sh; fixture-only, no network)
        run: ./tests/incident_learning_evidence_test.sh

      - name: Incident Learning Engine Step 4 suite (Human Gate / Approval flow, incident_human_gate.sh; fixture-only, no network)
        run: ./tests/incident_learning_human_gate_test.sh

      - name: Incident Learning Engine Step 5a suite (Phase 75, incident_analyzer.sh VERIFIED->ANALYZED/REJECTED duplicate check; fixture-only, no network)
        run: ./tests/incident_learning_analyzer_test.sh

      - name: Incident Learning Engine Step 5b suite (Promote flow, knowledge_promote(); fixture-only, no network)
        run: ./tests/incident_learning_promote_test.sh

      - name: Incident Learning Engine Step 6 suite (incident_learning_cron.sh wrapper; fixture-only, no network, never touches the Human Gate or Promote)
        run: ./tests/incident_learning_cron_test.sh

      - name: Incident Learning Engine Step 7 suite (advance/Human-Gate/Promote bypass hardening; fixture-only, no network)
        run: ./tests/incident_learning_advance_hardening_test.sh

      - name: Incident Learning Engine Step 8 suite (fail-safe / recovery / idempotency hardening; fixture-only, no network)
        run: ./tests/incident_learning_failsafe_test.sh

      - name: Incident Learning Engine concurrent-process locking suite (Phase 78; fixture-only, no network, includes a genuine two-real-process race)
        run: ./tests/incident_learning_lock_test.sh

      - name: Incident Learning Engine real Collector suite (Phase 81, CISA KEV; NO real network -- curl shadowed on PATH by a fixture script, real egress_check exercised against an isolated allowlist)
        run: ./tests/incident_learning_cisa_kev_collector_test.sh

      - name: Dashboard incident-timeline pairing suite (dashboard/build_incident_history.sh; fixture-only via WAIO_AUDIT_LOG, no network -- previously standalone/CI-excluded by analogy with the genuinely cost-incurring/timing-only suites below; re-investigated and found to have neither reason, wired in here)
        run: ./tests/build_incident_history_test.sh
