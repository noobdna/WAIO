name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check (canonical dispatch path only)
        run: |
          for f in waio.sh workers/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: shellcheck (canonical dispatch path only)
        run: shellcheck -S error waio.sh workers/*.sh
