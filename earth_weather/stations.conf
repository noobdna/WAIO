# earth_weather/stations.conf -- default station list for the global
# ("world-scale") Earth & Weather Intelligence pipeline
# (earth_weather/weather_agent_global.sh / correlation_engine_global.sh).
#
# format: NAME|LAT|LON|NOTE
#   NAME - station id (ASCII, no "|", used as a file/JSON key)
#   LAT/LON - decimal degrees, passed straight to Open-Meteo (a global
#     weather model -- not Japan/region-specific)
#   NOTE - free-form (documentation only): tectonic setting, why this
#     point was picked
#
# Deliberately diverse: several different plate-boundary types (a
# single "is there a relationship" question asked only at one location
# would say very little about whether any such thing generalizes), PLUS
# one intentional low-seismicity control point (AliceSprings) -- a
# stable continental interior, included so the analysis can compare
# "how does the same statistical test behave where earthquakes are
# rare" against the active stations, not just report on active zones
# alone.
#
# Override with EW_STATIONS_FILE=/path/to/other.conf for a different
# station set (tests use a small fixture file, never this one).
# Lines starting with # and blank lines are ignored.
Tokyo|35.6762|139.6503|Pacific Ring of Fire (subduction)
SanFrancisco|37.7749|-122.4194|San Andreas transform fault
Santiago|-33.4489|-70.6693|Nazca-South American subduction
Jakarta|-6.2088|106.8456|Sunda subduction zone
Istanbul|41.0082|28.9784|North Anatolian transform fault
Wellington|-41.2865|174.7762|Australian-Pacific plate boundary
Reykjavik|64.1466|-21.9426|Mid-Atlantic Ridge (divergent)
Kathmandu|27.7172|85.3240|Himalayan continental collision
Anchorage|61.2181|-149.9003|Aleutian subduction zone
AliceSprings|-23.6980|133.8807|Stable continental interior -- low-seismicity control point
